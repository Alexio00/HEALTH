<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://ffvqgbslvjocbwfurxrv.supabase.co wss://ffvqgbslvjocbwfurxrv.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>HEALTH</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="root">
    <section id="loading" class="panel">
      <h1>HEALTH</h1>
      <p>Проверяю сессию…</p>
    </section>

    <section id="login" class="panel hidden" aria-labelledby="login-title">
      <h1 id="login-title">HEALTH</h1>
      <p class="muted">Приватная медицинская карта. Доступ только владельцу.</p>
      <form id="login-form">
        <label>
          Email
          <input id="email" type="email" autocomplete="username" required>
        </label>
        <label>
          Пароль
          <input id="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Войти</button>
      </form>
      <p id="login-error" class="error" role="alert"></p>
    </section>

    <section id="app" class="hidden">
      <header class="topbar">
        <a class="brand" href="#/">HEALTH</a>
        <nav aria-label="Основная навигация">
          <a href="#/">Состояние</a>
          <a href="#/closed-cases">Закрытые случаи</a>
          <a href="#/records">Записи</a>
        </nav>
        <button id="logout" class="ghost" type="button">Выйти</button>
      </header>
      <section id="view" class="content" aria-live="polite"></section>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
