name: HEALTH Supabase keepalive (consolidated candidate)

on:
  schedule:
    - cron: "37 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-inrepo-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    name: Read-only keepalive (owner accepted exact SHA)
    if: >-
      github.repository == 'Alexio00/HEALTH' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == '1' &&
      vars.HEALTH_INREPO_KEEPALIVE_ENABLED == 'true' &&
      github.sha == vars.HEALTH_RELEASE_MAIN_ACCEPTED_SHA &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && github.actor_id == '308028794'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: health-private-automation
    env:
      GITHUB_ACTIONS: "true"
      HEALTH_KEEPALIVE_ACCEPTED_SHA: ${{ vars.HEALTH_KEEPALIVE_ACCEPTED_SHA }}
      HEALTH_KEEPALIVE_DB_URL: ${{ secrets.HEALTH_KEEPALIVE_DB_URL }}
      HEALTH_SUPABASE_CA_PEM: ${{ secrets.HEALTH_SUPABASE_CA_PEM }}
    steps:
      - name: Reject absent or invalid keepalive code pin
        run: |
          python3 - <<'PY'
          import os,re
          if not re.fullmatch('[a-f0-9]{40}',os.environ.get('HEALTH_KEEPALIVE_ACCEPTED_SHA','')):
              raise RuntimeError('missing_accepted_keepalive_pin')
          PY
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ vars.HEALTH_KEEPALIVE_ACCEPTED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require pinned commit on protected scheduler-code lineage
        env:
          PIN: ${{ vars.HEALTH_KEEPALIVE_ACCEPTED_SHA }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PIN"
          git fetch -q --no-tags origin 'refs/heads/scheduler-code:refs/remotes/origin/scheduler-code'
          git merge-base --is-ancestor "$PIN" refs/remotes/origin/scheduler-code
      - name: Match checked-out SHA to approved main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEALTH_KEEPALIVE_ACCEPTED_SHA"
      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Read-only database identity probe
        run: python3 scripts/automation/supabase_keepalive.py
