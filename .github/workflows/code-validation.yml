name: HEALTH code validation

on:
  push:
    branches: [main, "maintenance/audit-remediation-*"]
    paths:
      - "scripts/**"
      - "frontend/**"
      - "docs/**"
      - "db/**"
      - "supabase/**"
      - ".github/workflows/code-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - "frontend/**"
      - "docs/**"
      - "db/**"
      - "supabase/**"
      - ".github/workflows/code-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: health-synthetic
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Frontend syntax and synthetic contract checks
        run: |
          node --check --input-type=module < frontend/app.js
          node --check frontend/sw.js
          node frontend/tests/contract.mjs
      - name: Python syntax
        run: python3 -m py_compile scripts/migration/full_migration.py
      - name: Migration runner self-test
        run: python3 scripts/migration/full_migration.py self-test
      - name: Synthetic PostgreSQL 17 time and JSONB roundtrip
        env:
          HEALTH_SYNTHETIC_DB_URL: postgresql://postgres@127.0.0.1:5432/postgres
          PGPASSWORD: health-synthetic
        run: python3 scripts/migration/full_migration.py pg-roundtrip-test
      - name: Synthetic PostgreSQL full migration transaction and recovery gates
        env:
          HEALTH_SYNTHETIC_DB_URL: postgresql://postgres@127.0.0.1:5432/postgres
          PGPASSWORD: health-synthetic
        run: python3 scripts/migration/full_migration.py pg-full-cycle-test
      - name: B04-M03 disposable PostgreSQL service_role denial
        env:
          PGPASSWORD: health-synthetic
        run: |
          createdb -h 127.0.0.1 -U postgres b04_service_controls
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d b04_service_controls -f scripts/validation/test_service_role_controls.sql
          if psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d b04_service_controls -c "SET ROLE service_role; UPDATE public.operations SET id=id;" >/dev/null 2>&1; then
            echo "FAIL: service_role directly bypassed migration control gate"
            exit 1
          fi
      - name: Public repository secret-pattern guard
        run: python3 scripts/validation/public_secret_guard.py
