
name: HEALTH-TEST DB Connection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/health-test-db-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test restricted database connection
        shell: bash
        env:
          DB_URL: ${{ secrets.HEALTH_TEST_WRITER_DB_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${DB_URL:-}" ]]; then
            echo "::error::Database secret is missing"
            exit 1
          fi

          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq >/dev/null
            sudo apt-get install -y -qq postgresql-client >/dev/null
          fi

          # Report only a diagnostic CATEGORY; never echo a connection URL,
          # server address, password, or raw psql stderr in Actions logs.
          if [[ "$DB_URL" != postgresql://* && "$DB_URL" != postgres://* ]]; then
            echo "::error::Secret is not a PostgreSQL URI"
            exit 1
          fi

          # Validate only public connection structure; do not print any secret fields.
          python3 - <<'PY'
          import os
          import sys
          from urllib.parse import urlsplit
          try:
              parsed = urlsplit(os.environ["DB_URL"])
              checks = (
                  (parsed.username == "health_test_ci.yjmcesdayfmfissghzgm", "pooler role"),
                  (parsed.hostname is not None and parsed.hostname.endswith(".pooler.supabase.com"), "pooler host"),
                  (parsed.port == 5432, "session pooler port"),
                  (parsed.path == "/postgres", "database name"),
                  (bool(parsed.password), "password present"),
              )
          except (ValueError, KeyError):
              print("::error::Invalid PostgreSQL URI structure")
              sys.exit(1)
          failed = [label for success, label in checks if not success]
          if failed:
              for label in failed:
                  print("::error::Secret URI does not match expected " + label)
              sys.exit(1)
          print("PASS: expected restricted role and pooler URL structure")
          PY

          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT

          if ! result=$(PGCONNECT_TIMEOUT=10 psql "$DB_URL" -X -At -v ON_ERROR_STOP=1 \
            -c "SELECT CASE WHEN
              current_user = 'health_test_ci'
              AND has_function_privilege(
                current_user,
                'health_test_writer.v2_status(text)',
                'EXECUTE'
              )
              AND NOT has_table_privilege(
                current_user, 'public.records', 'INSERT'
              )
              THEN 'PASS' ELSE 'FAIL' END;" 2>"$error_file"); then

            category="unknown connection or SQL failure"
            if grep -Eqi 'could not translate host name|Name or service not known|Temporary failure in name resolution' "$error_file"; then
              category="DNS: invalid or unavailable pooler hostname"
            elif grep -Eqi 'Tenant or user not found|tenant/user .* not found|no such user|invalid tenant' "$error_file"; then
              category="pooler project or username mapping"
            elif grep -Eqi 'password authentication failed|SASL authentication failed|authentication failed for user' "$error_file"; then
              category="password rejected by database"
            elif grep -Eqi 'role .* does not exist' "$error_file"; then
              category="PostgreSQL role name not found"
            elif grep -Eqi 'Connection refused|Network is unreachable|No route to host|timeout expired|Connection timed out' "$error_file"; then
              category="network: pooler, host, port or firewall"
            elif grep -Eqi 'invalid URI query parameter' "$error_file"; then
              category="URI: unsupported query-string parameter"
            elif grep -Eqi 'invalid percent-encoded token|invalid percent encoding|invalid percent-encoded' "$error_file"; then
              category="URI: invalid percent-encoding in password or other field"
            elif grep -Eqi 'invalid URI port|invalid integer value|invalid port' "$error_file"; then
              category="URI: invalid port"
            elif grep -Eqi 'missing .* host|missing .* port' "$error_file"; then
              category="URI: missing host or port"
            elif grep -Eqi 'invalid connection option' "$error_file"; then
              category="URI: invalid connection option"
            elif grep -Eqi 'invalid URI|URI cannot contain|malformed' "$error_file"; then
              category="URI: malformed; check percent-encoding of password"
            elif grep -Eqi 'SSL|certificate|TLS' "$error_file"; then
              category="TLS/SSL configuration"
            elif grep -Eqi 'permission denied|does not exist' "$error_file"; then
              category="database object or SQL permission"
            fi
            echo "::error::Restricted database check failed; diagnostic category: $category"
            exit 1
          fi

          if [[ "$result" != "PASS" ]]; then
            echo "::error::Restricted permissions check failed"
            exit 1
          fi

          echo "PASS: restricted database connection verified"
