name: HEALTH complete backup (consolidation candidate)

on:
  schedule:
    # 03:00 Europe/Moscow. The workflow must remain on default main.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-inrepo-complete-backup
  cancel-in-progress: false

jobs:
  complete-backup:
    name: Complete archive - explicitly activated exact main SHA only
    if: >-
      github.repository == 'Alexio00/HEALTH' &&
      github.ref == 'refs/heads/main' &&
      vars.HEALTH_INREPO_BACKUP_ENABLED == 'true' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && github.actor_id == '308028794'))
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: health-private-backup
    env:
      HEALTH_RCLONE_VERSION: "1.75.1"
      HEALTH_COMPLETE_SERIALIZED: "1"
      HEALTH_REQUIRE_RESTRICTED_CAPTURE: "1"
      HEALTH_ACCEPTED_BACKUP_SHA: ${{ vars.HEALTH_BACKUP_EXECUTOR_SHA }}
      HEALTH_BACKUP_PRODUCER_SHA: ${{ vars.HEALTH_BACKUP_EXECUTOR_SHA }}
    steps:
      - name: Validate accepted immutable backup code pin before checkout
        run: |
          python3 - <<'PY'
          import os,re
          if not re.fullmatch('[a-f0-9]{40}',os.environ.get('HEALTH_ACCEPTED_BACKUP_SHA','')):
              raise RuntimeError('missing_accepted_backup_code_pin')
          PY
      - name: Checkout pinned accepted backup executor
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ vars.HEALTH_BACKUP_EXECUTOR_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require pinned commit on protected scheduler-code lineage
        env:
          PIN: ${{ vars.HEALTH_BACKUP_EXECUTOR_SHA }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PIN"
          git fetch -q --no-tags origin 'refs/heads/scheduler-code:refs/remotes/origin/scheduler-code'
          git merge-base --is-ancestor "$PIN" refs/remotes/origin/scheduler-code
      - name: Verify exact accepted executor and reject missing configuration
        env:
          SUPABASE_DB_URL: ${{ secrets.HEALTH_BACKUP_DB_URL }}
          HEALTH_SUPABASE_CA_PEM: ${{ secrets.HEALTH_SUPABASE_CA_PEM }}
          RCLONE_CONFIG_CONTENT: ${{ secrets.HEALTH_BACKUP_RCLONE_CONFIG }}
          HEALTH_PRIMARY_SOURCE_FOLDER_ID: ${{ secrets.HEALTH_PRIMARY_SOURCE_FOLDER_ID }}
          HEALTH_FROZEN_LINEAGE_SHA256: ${{ secrets.HEALTH_FROZEN_LINEAGE_SHA256 }}
          HEALTH_FROZEN_ORIGINAL_COUNT: ${{ secrets.HEALTH_FROZEN_ORIGINAL_COUNT }}
          HEALTH_BACKUP_PARENT_FOLDER_ID: ${{ secrets.HEALTH_BACKUP_PARENT_FOLDER_ID }}
          HEALTH_PRIMARY_DRIVE_OWNER_EMAIL: ${{ secrets.HEALTH_PRIMARY_DRIVE_OWNER_EMAIL }}
          HEALTH_BACKUP_DRIVE_OWNER_EMAIL: ${{ secrets.HEALTH_BACKUP_DRIVE_OWNER_EMAIL }}
        run: |
          python3 - <<'PY'
          import os,re,subprocess
          expected=os.environ.get('HEALTH_ACCEPTED_BACKUP_SHA','')
          checkout=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          if (not re.fullmatch(r'[0-9a-f]{40}',expected)
              or os.environ.get('GITHUB_REF')!='refs/heads/main'
              or checkout!=expected
              or os.environ.get('GITHUB_REF')!='refs/heads/main'):
              raise RuntimeError('exact_reviewed_backup_commit_required')
          keys=('SUPABASE_DB_URL','HEALTH_SUPABASE_CA_PEM','RCLONE_CONFIG_CONTENT',
                'HEALTH_PRIMARY_SOURCE_FOLDER_ID','HEALTH_FROZEN_LINEAGE_SHA256',
                'HEALTH_FROZEN_ORIGINAL_COUNT','HEALTH_BACKUP_PARENT_FOLDER_ID',
                'HEALTH_PRIMARY_DRIVE_OWNER_EMAIL','HEALTH_BACKUP_DRIVE_OWNER_EMAIL')
          if not all(os.environ.get(k) for k in keys):
              raise RuntimeError('private_backup_configuration_incomplete')
          if not re.fullmatch(r'[a-f0-9]{64}',os.environ['HEALTH_FROZEN_LINEAGE_SHA256']):
              raise RuntimeError('frozen_lineage_pin_invalid')
          if not os.environ['HEALTH_FROZEN_ORIGINAL_COUNT'].isdigit() or int(os.environ['HEALTH_FROZEN_ORIGINAL_COUNT'])<=0:
              raise RuntimeError('frozen_lineage_count_invalid')
          print('PASS: exact sha and required non-disclosed backup inputs')
          PY
      - name: Install checksum-verified rclone
        run: bash scripts/scheduler/install_rclone.sh
      - name: Pull exact recovery containers
        run: python3 scripts/scheduler/pull_fixed_recovery_images.py
      - name: Complete candidate capture, remote readback and isolated recovery
        env:
          SUPABASE_DB_URL: ${{ secrets.HEALTH_BACKUP_DB_URL }}
          HEALTH_SUPABASE_CA_PEM: ${{ secrets.HEALTH_SUPABASE_CA_PEM }}
          RCLONE_CONFIG_CONTENT: ${{ secrets.HEALTH_BACKUP_RCLONE_CONFIG }}
          HEALTH_PRIMARY_SOURCE_FOLDER_ID: ${{ secrets.HEALTH_PRIMARY_SOURCE_FOLDER_ID }}
          HEALTH_FROZEN_LINEAGE_SHA256: ${{ secrets.HEALTH_FROZEN_LINEAGE_SHA256 }}
          HEALTH_FROZEN_ORIGINAL_COUNT: ${{ secrets.HEALTH_FROZEN_ORIGINAL_COUNT }}
          HEALTH_BACKUP_PARENT_FOLDER_ID: ${{ secrets.HEALTH_BACKUP_PARENT_FOLDER_ID }}
          HEALTH_PRIMARY_DRIVE_OWNER_EMAIL: ${{ secrets.HEALTH_PRIMARY_DRIVE_OWNER_EMAIL }}
          HEALTH_BACKUP_DRIVE_OWNER_EMAIL: ${{ secrets.HEALTH_BACKUP_DRIVE_OWNER_EMAIL }}
        run: |
          set -euo pipefail
          umask 077
          export HEALTH_COMPLETE_PRIVATE_ROOT="$RUNNER_TEMP/health-inrepo-complete-private"
          mkdir -m 700 "$HEALTH_COMPLETE_PRIVATE_ROOT"
          python3 scripts/scheduler/complete_pipeline.py --mode daily
      - name: Delete temporary private files
        if: always()
        run: |
          python3 - <<'PY'
          import os,pathlib,shutil
          runner=pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          root=runner/'health-inrepo-complete-private'
          if root.exists():
              if root.is_symlink() or root.resolve().parent!=runner:
                  raise RuntimeError('private_cleanup_boundary_rejected')
              shutil.rmtree(root)
          PY
