name: HEALTH code validation

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "db/**"
      - "supabase/**"
      - ".github/workflows/code-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Python syntax
        run: python3 -m py_compile scripts/migration/full_migration.py
      - name: Migration runner self-test
        run: python3 scripts/migration/full_migration.py self-test
      - name: Public repository secret-pattern guard
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIE --exclude-dir=.git --exclude='*.md' --exclude='code-validation.yml' \
            '(sb_secret_[A-Za-z0-9_-]{20,}|postgres(ql)?://[^:[:space:]]+:[^@/[:space:]]{8,}@|client_secret[[:space:]]*[:=][[:space:]]*["'"']?[A-Za-z0-9_-]{20,}|refresh_token[[:space:]]*[:=][[:space:]]*["'"']?(1//|[A-Za-z0-9_-]{40,}))' .
