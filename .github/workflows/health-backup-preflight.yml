name: HEALTH backup read-only preflight (manual candidate)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-inrepo-complete-backup
  cancel-in-progress: false

jobs:
  preflight:
    name: Read only candidate packaging - NO cloud upload or rotation
    if: >-
      github.repository == 'Alexio00/HEALTH' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == '1' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor_id == '308028794' &&
      vars.HEALTH_INREPO_PREFLIGHT_ENABLED == 'true' &&
      github.sha == vars.HEALTH_RELEASE_MAIN_ACCEPTED_SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: health-private-backup
    env:
      HEALTH_RCLONE_VERSION: "1.75.1"
      HEALTH_RCLONE_ARCHIVE_SHA256: ${{ vars.HEALTH_RCLONE_ARCHIVE_SHA256 }}
      HEALTH_COMPLETE_SERIALIZED: "1"
      HEALTH_REQUIRE_RESTRICTED_CAPTURE: "1"
      HEALTH_BACKUP_EXECUTOR_SHA: ${{ vars.HEALTH_BACKUP_EXECUTOR_SHA }}
      HEALTH_BACKUP_PRODUCER_SHA: ${{ vars.HEALTH_BACKUP_EXECUTOR_SHA }}
      SUPABASE_DB_URL: ${{ secrets.HEALTH_BACKUP_DB_URL }}
      HEALTH_SUPABASE_CA_PEM: ${{ secrets.HEALTH_SUPABASE_CA_PEM }}
      RCLONE_CONFIG_CONTENT: ${{ secrets.HEALTH_BACKUP_RCLONE_CONFIG }}
      HEALTH_PRIMARY_SOURCE_FOLDER_ID: ${{ secrets.HEALTH_PRIMARY_SOURCE_FOLDER_ID }}
      HEALTH_FROZEN_LINEAGE_SHA256: ${{ secrets.HEALTH_FROZEN_LINEAGE_SHA256 }}
      HEALTH_FROZEN_ORIGINAL_COUNT: ${{ secrets.HEALTH_FROZEN_ORIGINAL_COUNT }}
      HEALTH_BACKUP_PARENT_FOLDER_ID: ${{ secrets.HEALTH_BACKUP_PARENT_FOLDER_ID }}
      HEALTH_PRIMARY_DRIVE_OWNER_EMAIL: ${{ secrets.HEALTH_PRIMARY_DRIVE_OWNER_EMAIL }}
      HEALTH_BACKUP_DRIVE_OWNER_EMAIL: ${{ secrets.HEALTH_BACKUP_DRIVE_OWNER_EMAIL }}
    steps:
      - name: Reject absent or invalid accepted backup code pin
        run: |
          python3 - <<'PY'
          import os,re
          value=os.environ.get('HEALTH_BACKUP_PRODUCER_SHA','')
          if not re.fullmatch('[a-f0-9]{40}',value):
              raise RuntimeError('missing_accepted_backup_code_pin')
          PY
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ vars.HEALTH_BACKUP_EXECUTOR_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require pinned commit on protected scheduler-code lineage
        env:
          PIN: ${{ vars.HEALTH_BACKUP_EXECUTOR_SHA }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PIN"
          git fetch -q --no-tags origin 'refs/heads/scheduler-code:refs/remotes/origin/scheduler-code'
          git merge-base --is-ancestor "$PIN" refs/remotes/origin/scheduler-code
      - name: Exact accepted SHA and private inputs
        run: |
          python3 - <<'PY'
          import os,subprocess,re
          sha=os.environ.get('HEALTH_BACKUP_PRODUCER_SHA','')
          if not re.fullmatch('[a-f0-9]{40}',sha) or sha!=os.environ.get('HEALTH_BACKUP_EXECUTOR_SHA') or sha!=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip():
              raise RuntimeError('unaccepted_backup_executor_sha')
          required=('SUPABASE_DB_URL','HEALTH_SUPABASE_CA_PEM','RCLONE_CONFIG_CONTENT','HEALTH_PRIMARY_SOURCE_FOLDER_ID','HEALTH_FROZEN_LINEAGE_SHA256','HEALTH_FROZEN_ORIGINAL_COUNT','HEALTH_BACKUP_PARENT_FOLDER_ID','HEALTH_PRIMARY_DRIVE_OWNER_EMAIL','HEALTH_BACKUP_DRIVE_OWNER_EMAIL')
          if any(not os.environ.get(key) for key in required):
              raise RuntimeError('missing_backup_configuration')
          print('PASS: reviewed SHA and non-disclosed preflight configuration')
          PY
      - name: Install checksum-verified rclone
        run: bash scripts/scheduler/install_rclone.sh
      - name: Pull pinned PostgreSQL recovery images
        run: python3 scripts/scheduler/pull_fixed_recovery_images.py
      - name: Prepare and verify temporary snapshot without cloud upload
        run: |
          set -euo pipefail
          umask 077
          export HEALTH_COMPLETE_PRIVATE_ROOT="$RUNNER_TEMP/health-preflight-private"
          mkdir -m 700 "$HEALTH_COMPLETE_PRIVATE_ROOT"
          python3 - <<'PY'
          import json,os,sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/scheduler')
          from complete_preview import preview
          try:
              result=preview(Path(os.environ['HEALTH_COMPLETE_PRIVATE_ROOT']), os.environ['RCLONE_CONFIG_CONTENT'])
              if result.get('status')!='ACTUAL_PORTABLE_COMPLETE_PREVIEW_PACKAGE_PASS' or result.get('restricted_capture_role_enforced') is not True:
                  raise ValueError()
          except Exception:
              print('STOPPED: private_readonly_preflight_failed')
              raise SystemExit(2) from None
          print('PASS: private preview archive built and checked; NOT uploaded and NOT activated')
          PY
      - name: Remove all private temporary data
        if: always()
        run: |
          python3 - <<'PY'
          import os,pathlib,shutil
          runner=pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          root=runner/'health-preflight-private'
          if root.exists():
              if root.is_symlink() or root.resolve().parent!=runner:
                  raise RuntimeError('private_preflight_cleanup_boundary_rejected')
              shutil.rmtree(root)
          PY
